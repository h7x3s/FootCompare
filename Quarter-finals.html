<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إحصائيات ربع النهائي</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
        color: #333;
        padding: 20px;
    }

    /* تصميم زر العودة للصفحة الرئيسية */
    .home-btn {
        display: inline-block;
        background-color: #2c3e50;
        color: #fff;
        padding: 10px 20px;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        margin-bottom: 20px;
        transition: background-color 0.3s ease;
    }

    .home-btn:hover {
        background-color: #1a252f;
    }

    /* حاوية البطاقات */
    .cards-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
    }

    /* تصميم بطاقة الموسم المتناسقة */
    .season-card {
        background-color: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .season-card h3 {
        margin-top: 0;
        color: #e74c3c; /* لون مميز للعنوان */
    }

    .season-card p {
        line-height: 1.6;
        margin-bottom: 20px;
    }

    /* تصميم زر تفاصيل النسخة */
    .details-btn {
        display: inline-block;
        text-align: center;
        background-color: #3498db;
        color: #fff;
        padding: 10px 15px;
        text-decoration: none;
        border-radius: 6px;
        font-size: 14px;
        transition: background-color 0.3s ease;
    }

    .details-btn:hover {
        background-color: #2980b9;
    }
</style>
</head>
<body>

    <a href="index.html" class="home-btn">← العودة للصفحة الرئيسية</a>

    <div class="cards-container">
        <div class="season-card">
            <h3>موسم 1994-1995</h3>
            <p><strong>الخصم:</strong> باريس سان جيرمان (فرنسا)<br>
            <strong>النتيجة الإجمالية:</strong> 3-2 لصالح باريس.</p>
            <a href="season-details.html" class="details-btn">تفاصيل النسخة</a>
        </div>
        
        <div class="season-card">
            <h3>موسم 2002-2003</h3>
            <p><strong>الخصم:</strong> يوفنتوس (إيطاليا)<br>
            <strong>النتيجة الإجمالية:</strong> 3-2 لصالح يوفنتوس.</p>
            <a href="season-details.html" class="details-btn">تفاصيل النسخة</a>
        </div>
    </div>

</body>
</html>
