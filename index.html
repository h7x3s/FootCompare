            <div id="continentalGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 20px;">
                </div>

            <div id="countriesGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px;">
                </div>

            <div id="exploreDetails" style="display: none; margin-top: 25px; background: linear-gradient(135deg, rgba(0,40,85,0.9) 0%, rgba(0,0,0,0.8) 100%); padding: 20px; border-radius: 12px; border: 1px solid var(--light-blue); box-shadow: 0 4px 15px rgba(0,0,0,0.5);">

                    <button onclick="closeExploreDetails()" style="background: rgba(255,0,0,0.2); color: #ff4d4d; border: 1px solid #ff4d4d; border-radius: 5px; width: 30px; height: 30px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;">&times;</button>
