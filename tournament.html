<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل البطولة</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-content" style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1200px; padding: 0 20px;">
            <a href="index.html" style="display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.1); color: var(--text-white); text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s;"><i class="fas fa-arrow-right"></i> <span id="backText">العودة للرئيسية</span></a>
        </div>
    </header>

    <main class="club-page" style="max-width: 1000px; margin: 0 auto; padding: 20px;">
        <section id="tournamentProfile" class="club-header" style="background: linear-gradient(135deg, rgba(0,40,85,0.9) 0%, rgba(0,0,0,0.8) 100%); padding: 30px; border-radius: 15px; border: 1px solid var(--light-blue); box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 30px; margin-bottom: 30px; flex-wrap: wrap;">
            </section>

        <section class="club-trophies">
            <h2><i class="fas fa-history" style="color: gold;"></i> <span id="historyTitle">السجل التاريخي للبطولة</span></h2>
            <div id="tournamentHistoryList" style="margin-top: 20px;">
                </div>
        </section>
    </main>

    <script src="database.js" charset="utf-8"></script>
    <script src="tournament.js" charset="utf-8"></script>
</body>
</html>
